<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Magazine</title>
<meta name="description" content="A 16-page A5 booklet for guests: welcome, the three days, the events, the menus, the map and the little things.">
<script src="wedding.config.js"></script>
<script>(function(){var q=new URLSearchParams(location.search).get("palette");var t=q||(window.WEDDING&&window.WEDDING.theme)||"midnight";if(t!=="midnight")document.documentElement.dataset.palette=t;})();</script>
<link rel="stylesheet" href="assets/wedding.css">
<style>
  body { background: var(--paper-2); }
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: center; padding: var(--s-5) var(--gutter); }
  .toolbar .meta { width: 100%; text-align: center; margin: 0; }

  /* ── The book: A5 pages, shown as spreads on wide screens ─────────────── */
  .book { display: grid; grid-template-columns: 148mm; justify-content: center; gap: 8mm 0; padding-bottom: var(--s-8); }
  @media (min-width: 1200px) {
    .book { grid-template-columns: 148mm 148mm; }
    .book .page:first-child { grid-column: 2; }
    .book .page:nth-child(2n) { box-shadow: inset -14px 0 24px -20px rgba(28,26,24,.35); }   /* gutter shadow, verso */
    .book .page:nth-child(2n+1) { box-shadow: inset 14px 0 24px -20px rgba(28,26,24,.35); }
    .book .page:last-child { grid-column: 1; }
  }
  .page {
    position: relative; width: 148mm; height: 210mm; overflow: hidden;
    background-color: var(--paper); padding: 16mm 13mm 16mm; font-size: 9.5pt; line-height: 1.5; color: var(--ink-2);
    outline: 1px solid var(--paper-3);
  }
  .page p { margin: 0 0 2.2mm; }
  .folio { position: absolute; left: 0; right: 0; bottom: 8mm; text-align: center; font-size: 6.5pt; letter-spacing: .25em; text-transform: uppercase; color: var(--ink-3); }
  .folio b { color: var(--kumkum); font-weight: 600; margin: 0 .6em; }
  .page .eyebrow { font-size: 6.8pt; margin-bottom: 2mm; }
  .page h2 { font-size: 22pt; line-height: 1.05; margin-bottom: 4mm; }
  .page h2 em { font-style: italic; color: var(--kumkum); }
  .page h3 { font-size: 13pt; margin: 4mm 0 1.5mm; }
  .page .lead { font-size: 11.5pt; line-height: 1.4; }
  .page .drop::first-letter { font-family: var(--font-display); font-size: 34pt; float: left; line-height: .8; padding: 2pt 4pt 0 0; color: var(--kumkum); }
  .page .rule { margin: 4mm auto; }
  .page .meta { font-size: 8pt; }
  .full { padding: 0; }
  .page.text { font-size: 11pt; line-height: 1.6; }
  .page.text .lead { font-size: 13pt; }
  .page.text h2 { font-size: 26pt; }
  .page .end { margin-top: 8mm; }

  /* Cover */
  .cover { color: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background-color: var(--kumkum); color: var(--paper); }
  .cover.jaali { background-image: var(--jaali-gold); background-size: 64px 64px; }
  .cover .inner { position: absolute; inset: 9mm; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10mm; }
  .cover .orn.l { background: var(--kumkum); }
  .cover .seal { width: 22mm; height: 22mm; color: var(--gold-2); margin-bottom: 6mm; }
  .cover .eyebrow { color: var(--gold-2); }
  .cover .names { font-size: 40pt; color: var(--paper); }
  .cover .names em { color: var(--paper); }
  .cover .names .amp { color: var(--gold-2); }
  .cover .title { font-family: var(--font-display); font-style: italic; font-size: 14pt; color: var(--gold-2); margin-top: 6mm; }
  .cover .dates { font-size: 7.5pt; letter-spacing: .25em; text-transform: uppercase; color: var(--paper); opacity: .85; margin-top: 2mm; }

  /* Inside cover */
  .shloka-page { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .shloka-page .devanagari { font-size: 30pt; line-height: 1.3; }
  .shloka-page .seal { width: 18mm; height: 18mm; margin-bottom: 8mm; }
  .shloka-page .arch { width: 30mm; }

  /* Schedule page */
  .sched .dayblk { margin-bottom: 4mm; }
  .sched .dayblk h3 { display: flex; align-items: baseline; gap: 3mm; border-bottom: 1px solid var(--gold); padding-bottom: 1mm; margin-top: 3mm; }
  .sched .dayblk h3 b { font-family: var(--font-display); font-weight: 400; font-size: 20pt; color: var(--kumkum); }
  .sched .dayblk h3 span { font-family: var(--font-text); font-size: 6.8pt; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  .sched table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
  .sched td { padding: 1.3mm 0; border-top: 1px dotted var(--paper-3); vertical-align: top; }
  .sched tr:first-child td { border-top: 0; }
  .sched td.t { width: 16mm; font-family: var(--font-display); font-size: 11pt; color: var(--ink); white-space: nowrap; }
  .sched td.n b { font-family: var(--font-display); font-weight: 500; font-size: 11pt; color: var(--ink); display: block; line-height: 1.1; }
  .sched td.n span { color: var(--ink-3); }
  .sched tr.m td { padding: .8mm 0; }
  .sched tr.m td.t { font-size: 9.5pt; color: var(--ink-3); }
  .sched td.n i { font-family: var(--font-display); font-size: 10pt; color: var(--ink-2); display: block; line-height: 1.1; }

  /* Dress page */
  .wear { display: grid; gap: 3mm; }
  .wear .item { display: grid; grid-template-columns: 22mm 1fr; gap: 3mm; padding: 2.5mm 0; border-top: 1px solid var(--paper-3); font-size: 8.5pt; }
  .wear .item:first-child { border-top: 0; }
  .wear .item b { font-family: var(--font-display); font-weight: 500; font-size: 12pt; color: var(--ink); line-height: 1.1; }
  .wear .item .swatches { margin-top: 1.5mm; }
  .wear .item .swatches i { width: 5mm; height: 5mm; }

  /* Event page */
  .evt .big { font-size: 34pt; margin: 0 0 1mm; }
  .evt .kicker { font-family: var(--font-display); font-style: italic; font-size: 13pt; color: var(--gold); margin-bottom: 4mm; }
  .evt .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin: 4mm 0; padding: 3mm 0; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); font-size: 8.5pt; }
  .evt .facts b { display: block; font-size: 6.5pt; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: .5mm; }
  .evt .facts .v { font-family: var(--font-display); font-size: 12pt; color: var(--ink); line-height: 1.15; }
  .evt .dress { padding: 3mm 4mm; background: var(--paper-2); border-left: 1.5px solid var(--gold); font-size: 8.5pt; margin: 3mm 0; }
  .evt .dress b { display: block; font-size: 6.5pt; letter-spacing: .2em; text-transform: uppercase; color: var(--kumkum); margin-bottom: 1mm; }
  .evt .tl { list-style: none; padding: 0; margin: 3mm 0 0; font-size: 8.5pt; }
  .evt .tl li { display: grid; grid-template-columns: 12mm 1fr; gap: 3mm; padding: 1mm 0; border-top: 1px dotted var(--paper-3); }
  .evt .tl li b { font-family: var(--font-display); font-weight: 500; font-size: 11pt; color: var(--kumkum); }

  /* Menu pages */
  .menu .block { margin-bottom: 3mm; }
  .menu .block h3 { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--gold); padding-bottom: 1mm; margin: 0 0 2mm; }
  .menu .block h3 small { font-family: var(--font-text); font-size: 6.5pt; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  .menu .cols { columns: 2; column-gap: 5mm; font-size: 7.6pt; line-height: 1.35; }
  .menu .cols.three { columns: 3; column-gap: 4mm; }
  .menu .st { break-inside: avoid; margin-bottom: 1.6mm; }
  .menu .st b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 10.5pt; color: var(--kumkum); }
  .menu .st span { display: block; }

  /* Map page */
  .mapcard { position: relative; height: 62mm; border: 1px solid var(--gold); background: var(--paper-2); margin: 3mm 0 4mm; overflow: hidden; }
  .mapcard svg.roads { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mapcard .pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); width: 9mm; color: var(--kumkum); }
  .mapcard .lbl { position: absolute; left: 50%; top: 52%; transform: translateX(-50%); font-family: var(--font-display); font-size: 11pt; color: var(--ink); white-space: nowrap; }
  .mapcard .qr { position: absolute; right: 3mm; bottom: 3mm; width: 22mm; padding: 1.5mm; }
  .mapcard .qrl { position: absolute; right: 3mm; bottom: 26mm; width: 22mm; font-size: 6.2pt; letter-spacing: .12em; text-transform: uppercase; color: var(--kumkum); text-align: center; line-height: 1.3; }
  .rows { gap: 0; }
  .row { grid-template-columns: 17mm 1fr; padding: 1.5mm 0; font-size: 8pt; line-height: 1.4; }
  .row b { font-size: 6.5pt; }

  /* Back cover */
  .backcover { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .backcover .qr { width: 42mm; margin: 6mm auto; }
  .backcover .seal { width: 14mm; height: 14mm; }

  /* Print */
  @page { size: A5 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .book { display: block; padding: 0; }
    .page { outline: 0; box-shadow: none !important; page-break-after: always; break-after: page; margin: 0; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .cover, .jaali { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar no-print">
  <button class="btn" onclick="window.print()">Print / save as PDF</button>
  <a class="btn ghost" href="guest.html">Guest page</a>
  <a class="btn ghost" href="hamper.html">Hamper plan</a>
  <p class="meta">A5 · 16 pages · saddle-stitched. Wide screens show it as spreads; print gives one page per sheet for the printer to impose.</p>
</div>
<div class="book" id="book"></div>

<script src="assets/vendor/qrcode-generator.js"></script>
<script src="assets/wedding.js"></script>
<script>
(function () {
  const { W, fmtDate, fmtTime, days, mealsFor, sealSVG, ganesha, ornate, ICON, qrSVG, swatches, directions, city, cityDot } = WX;
  const one = W.couple.one, two = W.couple.two;
  const ev = Object.fromEntries(W.events.map(e => [e.id, e]));
  const short = s => s.split(",")[0];
  document.title = `${one.first} & ${two.first} · The wedding book`;

  const page = (cls, html) => `<section class="page ${cls}">${html}</section>`;
  const folio = () => `<div class="folio">${one.first} <b>&amp;</b> ${two.first}</div>`;
  const stations = m => `<div class="cols ${m.stations.length >= 5 ? "three" : ""}">${m.stations.map(s => `<div class="st"><b>${s.station}</b>${s.items.map(i => `<span>${i}</span>`).join("")}</div>`).join("")}</div>`;
  const meal = (id) => (W.meals || []).find(m => m.id === id);
  const eventPage = (e, extra) => page("evt", `
    <p class="eyebrow">${fmtDate(e.day, "long")}</p>
    <h2 class="big">${e.title}</h2>
    <p class="kicker">${e.kicker}</p>
    <div class="facts">
      <div><b>When</b><div class="v">${fmtTime(e.start)} – ${fmtTime(e.end)}</div></div>
      <div><b>Where</b><div class="v">${e.where}</div></div>
    </div>
    <p>${e.note}</p>
    <div class="dress"><b>What to wear</b>${e.dress} ${swatches(e.palette)}</div>
    ${e.timeline ? `<ul class="tl">${e.timeline.map(t => `<li><b>${t.at}</b><span>${t.what}</span></li>`).join("")}</ul>` : ""}
    ${extra || ""}
    ${folio()}`);

  const oneVenue = W.events.every(e => e.where === W.events[0].where);
  const P = [];

  // 1 · Cover
  P.push(page("cover jaali full", `
    <div class="inner ornate">
      ${ornate()}
      <div class="seal">${sealSVG()}</div>
      <p class="eyebrow">The wedding of</p>
      <h1 class="display names"><em>${one.first}</em><span class="amp">&amp;</span><em>${two.first}</em></h1>
      <p class="title">A book for our guests</p>
      <p class="dates">${fmtDate(days()[0].day, "short")} – ${fmtDate(days().at(-1).day, "short")} ${fmtDate(W.wedding.date, "year")}${cityDot}</p>
    </div>`));

  // 2 · Inside cover
  P.push(page("shloka-page", `
    <div style="margin-bottom:5mm">${ganesha()}</div>
    <p class="devanagari" style="font-size:14pt;margin-bottom:8mm">${W.wedding.ganesh}</p>
    <p class="devanagari">${W.wedding.shloka}</p>
    <p class="eyebrow ink">${W.wedding.shlokaSub}</p>
    <div class="rule"><i></i></div>
    <p class="lead italic measure">“Two families, one courtyard, three days. Keep this book in your bag.”</p>
    ${folio()}`));

  // 3 · Welcome
  P.push(page("text", `
    <p class="eyebrow">Welcome</p>
    <h2>Thank you for <em>coming home</em> with us.</h2>
    ${W.copy.welcomeLetter.map((t, i) => `<p class="${i ? "" : "drop"}">${t}</p>`).join("")}
    <p class="lead italic" style="margin-top:6mm">With love,<br>${one.first} &amp; ${two.first}</p>
    <div class="rule end"><i></i></div>
    ${folio()}`));

  // 4 · Families
  const fam = (f) => `
    <p class="eyebrow ink">${f.familyName}</p>
    <p class="lead">${f.parents}</p>
    <p class="meta">${f.siblings ? "with " + f.siblings + ", " : ""}${f.familyLine}<br>welcome you on behalf of their ${f.role}, <b>${f.full}</b></p>
    <p class="meta" style="color:var(--gold)">${f.address}</p>`;
  P.push(page("center", `
    <p class="eyebrow">The families</p>
    <h2>Two homes, <em>one</em> table.</h2>
    <div class="rule"><i></i></div>
    ${fam(one)}
    <div class="rule"><i></i></div>
    ${fam(two)}
    <div class="rule"><i></i></div>
    <p class="meta measure mx">Grandparents, aunts, uncles, cousins and the friends who became family: you know who you are, and we will find you at the sangeet.</p>
    ${folio()}`));

  // 5 · Story
  P.push(page("text", `
    <p class="eyebrow">Our story</p>
    <h2>Two ends of the <em>country</em>.</h2>
    ${W.copy.story.map((t, i) => `<p class="${i ? "" : "drop"}">${t}</p>`).join("")}
    <div class="rule end"><i></i></div>
    ${folio()}`));

  // 6 · Schedule at a glance
  P.push(page("sched", `
    <p class="eyebrow">The three days</p>
    <h2>At a <em>glance</em>.</h2>
    ${days().map(d => `
      <div class="dayblk">
        <h3><b>${fmtDate(d.day, "dnum")}</b><span>${fmtDate(d.day, "long")} · Day ${d.index}</span></h3>
        <table>${d.agenda.map(e => e.kind === "meal" ? `<tr class="m"><td class="t">${fmtTime(e.start)}</td><td class="n"><i>${e.title}</i><span>till ${fmtTime(e.end)}</span></td></tr>` : `<tr><td class="t">${fmtTime(e.start)}</td><td class="n"><b>${e.title}</b><span>${oneVenue ? e.kicker : e.where}</span></td></tr>`).join("")}</table>
      </div>`).join("")}
    <p class="meta" style="margin-top:3mm">${oneVenue ? "Everything at " + W.venue.name + ", " + W.wedding.city + ". " : ""}${W.alwaysOn}</p>
    ${folio()}`));

  // 7 · What to wear
  P.push(page("", `
    <p class="eyebrow">What to wear</p>
    <h2>Colours to <em>lean into</em>.</h2>
    <p class="meta">None of this is a rule. It is a palette, so the photographs look like one wedding and not five.</p>
    <div class="wear">
      ${W.events.map(e => `<div class="item"><div><b>${e.title}</b>${swatches(e.palette)}</div><div>${e.dress}</div></div>`).join("")}
    </div>
    ${folio()}`));

  // 8–11 · Event pages (bidai rides on the wedding page)
  P.push(eventPage(ev.tilak));
  P.push(eventPage(ev.sangeet));
  P.push(eventPage(ev.haldi));
  P.push(eventPage(ev.wedding, `
    <div class="dress" style="margin-top:4mm;border-left-color:var(--rose)"><b>${fmtDate(ev.bidai.day, "long")} · ${ev.bidai.title}, ${fmtTime(ev.bidai.start)}</b>${ev.bidai.note}</div>`));

  // 12–14 · Menus (the resort’s menu, entirely vegetarian)
  const menuPage = (ids, eyebrow, head, foot) => page("menu", `
    <p class="eyebrow">${eyebrow}</p>
    <h2>${head}</h2>
    ${ids.map(id => meal(id)).filter(Boolean).map(m => `<div class="block"><h3>${m.title}<small>${fmtDate(m.day, "short")} · ${fmtTime(m.start)} – ${fmtTime(m.end)}</small></h3>${stations(m)}</div>`).join("")}
    ${foot ? `<p class="meta" style="margin-top:2mm">${foot}</p>` : ""}
    ${folio()}`);
  P.push(menuPage(["lunch-10", "tea-10", "dinner-10"], "The menu · day one", `Eat <em>well</em>.`, "The whole wedding is vegetarian. " + W.alwaysOn));
  P.push(menuPage(["breakfast-11", "haldi-11", "lunch-11", "tea-11"], "The menu · day two", `Then eat <em>more</em>.`));
  P.push(menuPage(["dinner-11", "breakfast-12"], "The menu · the wedding dinner, and the morning after", `Eighteen <em>counters</em>.`, "Dinner is served from 7 till 11:30, so eat whenever you arrive; the counters are replenished all evening."));

  // 15 · Getting there & the little things
  P.push(page("", `
    <p class="eyebrow">Getting there &amp; the little things</p>
    <h2>${W.venue.name}</h2>
    <p class="meta">${W.venue.address}</p>
    <div class="mapcard" style="height:34mm">
      <svg class="roads" viewBox="0 0 300 140" preserveAspectRatio="none" fill="none" stroke="#B99A63" stroke-opacity=".5">
        <path d="M-10 40 C 60 30, 120 70, 310 55" stroke-width="2"/><path d="M-10 100 C 80 110, 160 80, 310 95" stroke-width="1.2"/>
        <path d="M70 -10 C 80 60, 60 100, 90 150" stroke-width="1.2"/><path d="M210 -10 C 200 50, 230 100, 220 150" stroke-width="2"/>
      </svg>
      <svg class="pin" viewBox="0 0 24 30" fill="currentColor"><path d="M12 30s-9-9.6-9-17a9 9 0 0 1 18 0c0 7.4-9 17-9 17z"/><circle cx="12" cy="13" r="3.5" fill="#F4EFE6"/></svg>
      <div class="lbl">${W.venue.name}</div>
      <div class="qrl" style="bottom:22mm">Scan for<br>directions</div>
      <div class="qr" style="width:18mm">${qrSVG(directions(), { seal: false })}</div>
    </div>
    <div class="rows">
      ${W.travel.map(t => `<div class="row"><b>By ${t.by}</b><span>${t.text}</span></div>`).join("")}
      <div class="row"><b>Stay</b><span>${W.stay.address} ${W.stay.note}</span></div>
      <div class="row"><b>Gifts</b><span>${W.copy.giftNote}</span></div>
      <div class="row"><b>Phones</b><span>Down for the pheras, please. Up for everything else; tag ${W.couple.hashtag}.</span></div>
      ${W.contacts.slice(0, 2).map(c => `<div class="row"><b>${c.role}</b><span>${c.name} · ${c.phone}</span></div>`).join("")}
    </div>
    ${folio()}`));

  // 16 · Back cover
  P.push(page("backcover", `
    <div class="seal">${sealSVG()}</div>
    <p class="lead italic" style="margin-top:4mm">${W.copy.thankYou}</p>
    <div class="qr">${qrSVG(W.guestUrl)}</div>
    <p class="eyebrow ink">Scan for the live schedule, map &amp; menus</p>
    <p class="meta">${W.guestUrl.replace(/^https?:\/\//, "")}</p>
    <p class="meta" style="margin-top:8mm">${one.full} &amp; ${two.full} · ${fmtDate(W.wedding.date)}${cityDot} · ${W.couple.hashtag}</p>`));

  document.getElementById("book").innerHTML = P.join("");
  // Page numbers in the folio (cover and back cover carry none)
  document.querySelectorAll(".page .folio").forEach((f, i) => { f.innerHTML = `${i + 2} &nbsp;·&nbsp; ` + f.innerHTML; });
})();
</script>
</body>
</html>
